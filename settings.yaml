meshcore:
  port: /dev/serial/by-id/usb-RAKwireless_WisCore_RAK4631_Board_E7085CC84F09F337-if00  # override locally with MESHCORE_PORT
  channel: "#kriis"
  advert_interval_seconds: 3600
  bot_mention: "@[Kriisibot]"

eesti_ee:
  enabled: true
  url: https://api.app.eesti.ee/api/sitrep/v1/full-events
  poll_interval_seconds: 300

weather:
  enabled: true
  poll_interval_seconds: 600   # warnings don't change that fast
  min_level: 3                 # Meteoalarm awareness level to broadcast: 3 = orange+red, 4 = red only

rss_feeds:
  - url: https://www.err.ee/rss
    name: "ERR uudised"
    enabled: true
  # - url: https://example.com/feed.rss
  #   name: "Custom feed"
  #   enabled: false

claude:
  model: claude-haiku-4-5-20251001
  max_response_chars: 140  # per-sentence instruction to Claude; chunker splits full responses

tarktee:
  enabled: true
  poll_interval_seconds: 120
  accidents_enabled: true
  hazards_enabled: false

reticulum:
  enabled: true                         # joins the prnsd shared instance of the Docker stack
  config_dir: ~/.reticulum              # must match the shared instance's config dir exactly
  identity_dir: ./reticulum_identity    # where kriisibot's own RNS identity + LXMF storage live
  display_name: "Kriisibot"
  distribution_group_hash: "ce8ea3b9014a5aeddbf00e197832af02"  # lxmf-distribution-group container
  propagation_node_hash: "0e332dff8d34303d3f1df78764c5035e"    # lxmd container
  announce_interval_seconds: 3600

event_taxonomy:
  - hostile_drone
  - fallen_tree
  - wildfire
  - flood
  - storm
  - extreme_weather
  - power_outage
  - road_blocked
  - road_accident
  - road_hazard
  - chemical_hazard
  - air_raid
  - explosion
  - missing_person
  - civil_unrest
  - other

user_reports:
  report_trigger: "!raport"
  cooldown_seconds: 600
  max_stored: 50
  max_age_hours: 6
  session_timeout_minutes: 30   # how long a PM intake session stays open between replies

targeted_alerts:
  enabled: true
  radius_km: 50             # send PM to companions within this radius of the event
  critical_event_types:     # these event types trigger targeted PMs
    - air_raid
    - hostile_drone
    - chemical_hazard
    - explosion

database:
  path: events.db
